<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id ="add"></p>
    <p id ="minus"></p>
    <p id ="multiply"></p>
    <p id ="division"></p>
    <script>
        let num1 = 12
        let num2 = 23
        let add = num1 + num2
        let minus = num1 - num2
        let multiply = num1 * num2
        let division = num1 / num2
        document.getElementById("add").innerHTML="The added value is" + add
        document.getElementById("minus").innerHTML="The Subtracted value is" + minus
        document.getElementById("division").innerHTML="The divided value is" + division
        document.getElementById("multiply").innerHTML = "The added value is" + multiply
    </script>
</body>
</html>
